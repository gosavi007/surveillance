<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Metallic Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Cyber Neon Cyan to Electric Blue Gradient -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Camera Lens Reflection Gradient -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glowing Live Surveillance Ruby Sensor Core -->
    <radialGradient id="pupilGlow" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ff3b69"/>
      <stop offset="65%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>
  </defs>

  <!-- High-Tech Cyber Security Shield Frame -->
  <path d="M 32 3 L 57 13 C 57 37 47 52 32 61 C 17 52 7 37 7 13 Z" 
        fill="url(#shieldGrad)" stroke="url(#cyanNeon)" stroke-width="2.6" stroke-linejoin="round"/>
  
  <!-- Subtle Inner Hologram Bevel Line -->
  <path d="M 32 7.5 L 52.5 16 C 52.5 35 44 47.5 32 55.5 C 20 47.5 11.5 35 11.5 16 Z" 
        fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.45"/>

  <!-- Cybernetic Eye / CCTV Silhouette -->
  <path d="M 14 32 C 21 21 43 21 50 32 C 43 43 21 43 14 32 Z" 
        fill="#050914" stroke="url(#cyanNeon)" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- HUD Digital Reticle Ring -->
  <circle cx="32" cy="32" r="10" fill="none" stroke="#00f2fe" stroke-width="1.8" stroke-dasharray="7 3 3 3"/>

  <!-- Optical Camera Aperture Ring -->
  <circle cx="32" cy="32" r="6.2" fill="#0b172a" stroke="url(#lensGrad)" stroke-width="1.6"/>

  <!-- Live Recording Core Node (Ruby Glowing Sensor) -->
  <circle cx="32" cy="32" r="3.4" fill="url(#pupilGlow)"/>
  <circle cx="30.8" cy="30.8" r="1" fill="#ffffff" opacity="0.95"/>

  <!-- Tactical Target Precision Crosshairs -->
  <line x1="32" y1="18.5" x2="32" y2="21.5" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="32" y1="42.5" x2="32" y2="45.5" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="18.5" y1="32" x2="21.5" y2="32" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="42.5" y1="32" x2="45.5" y2="32" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round"/>
</svg>
